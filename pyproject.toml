[project]
name = "jev-ultrafast-mcp"
version = "0.1.0"
description = "Headless Jev Ultrafast browser agent over MCP, with OpenAI GPT-6 Luna"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "mcp>=1.26,<2",
  "playwright>=1.56,<2",
  "httpx[http2]>=0.28,<1",
  "openai>=2,<3",
  "python-dotenv>=1.1,<2",
  "psutil>=7,<8",
]

[project.scripts]
jev-ultrafast-mcp = "jev_ultrafast_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ultrafast", "jev_ultrafast_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
